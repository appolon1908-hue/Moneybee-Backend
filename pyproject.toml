[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moneybee-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "PyJWT[crypto]>=2.13.0,<3",
  "email-validator>=2.3.0,<3",
  "httpx>=0.28,<1",
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "cryptography>=46,<51",
  "redis>=6.4,<7",
  "codestra-moneybee-connectors @ git+https://github.com/appolon1908-hue/SDK-repository.git@fd9a5c3fd49534a7f7492a452f53815c386687b9#subdirectory=python/moneybee-connectors"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.0,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]
