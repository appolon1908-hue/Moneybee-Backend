[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "moneybee-backend"
version = "0.1.0"
description = "MoneyBeeLoans authoritative lending backend"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]>=0.35,<0.36",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.16,<1.17",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<7",
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=45,<46",
    "httpx>=0.28,<0.29",
    "python-multipart>=0.0.20,<0.1",
    "email-validator>=2.2,<3",
    "structlog>=25,<26"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<0.13",
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
