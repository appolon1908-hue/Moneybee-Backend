services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: moneybee
      POSTGRES_PASSWORD: moneybee-local-only
      POSTGRES_DB: moneybee
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneybee -d moneybee"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["redis-data:/data"]

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Optional: exercises the real malware-scan path (app/integrations/malware_scan.py,
  # app.worker.scan_pending_document) instead of leaving it untestable locally.
  # Start with `docker compose --profile malware-scan up`, then set
  # MALWARE_SCAN_PROVIDER=clamav / CLAMAV_HOST=clamav in .env. Stays out of the
  # default `up` since MALWARE_SCAN_PROVIDER is disabled by default and the
  # virus-definition download on first start is slow.
  clamav:
    image: clamav/clamav:stable
    profiles: ["malware-scan"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes: ["clamav-data:/var/lib/clamav"]

  # Optional: exercises the real bank-credential-store path
  # (app/integrations/vault.py) instead of leaving it untestable locally.
  # Start with `docker compose --profile bank-credential-store up`, then set
  # BANK_CREDENTIAL_STORE_PROVIDER=vault / VAULT_ADDR=http://vault:8200 /
  # VAULT_TOKEN=moneybee-local-only-root-token in .env. Dev mode
  # (auto-unsealed, in-memory, fixed root token) is safe for local testing
  # ONLY - production uses the real, initialized/unsealed server config at
  # deploy/vault-config.hcl instead, never this.
  vault:
    image: hashicorp/vault:latest
    profiles: ["bank-credential-store"]
    command: ["server", "-dev", "-dev-root-token-id=moneybee-local-only-root-token"]
    cap_add: ["IPC_LOCK"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  redis-data:
  clamav-data:
