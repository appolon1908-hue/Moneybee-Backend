services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: moneybee
      POSTGRES_USER: moneybee
      POSTGRES_PASSWORD: moneybee
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneybee -d moneybee"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - moneybee_pg:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  moneybee_pg:
