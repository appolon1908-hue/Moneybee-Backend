services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneybee
      POSTGRES_USER: moneybee
      POSTGRES_PASSWORD: moneybee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneybee -d moneybee"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee@postgres:5432/moneybee
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  postgres_data:
  redis_data:
