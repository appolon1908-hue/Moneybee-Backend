name: contract-snapshot-sync

on:
  push:
    branches:
      - "claude/system-review-architecture-8vo66p"
    paths-ignore:
      - "openapi.json"
      - "docs/openapi/**"
      - "docs/API_ENDPOINT_CATALOG.md"

permissions:
  contents: write

concurrency:
  group: contract-snapshot-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-reviewed-entries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./contract-snapshot.db
      AUTO_CREATE_SCHEMA: "true"
      LOCAL_AUTH_BYPASS: "true"
      ENABLE_EXTERNAL_DELIVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install reviewed dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Refresh only already-reviewed contract entries
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from app.main import app

          root = Path.cwd()
          generated = app.openapi()
          baseline_path = root / "openapi.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))

          generated_paths = generated.get("paths", {})
          generated_schemas = generated.get("components", {}).get("schemas", {})
          baseline_paths = baseline.setdefault("paths", {})
          baseline_schemas = baseline.setdefault("components", {}).setdefault("schemas", {})

          missing_baseline_paths = sorted(set(baseline_paths) - set(generated_paths))
          missing_baseline_schemas = sorted(set(baseline_schemas) - set(generated_schemas))
          if missing_baseline_paths or missing_baseline_schemas:
              raise SystemExit(
                  "Refusing to remove reviewed baseline entries: "
                  f"paths={missing_baseline_paths}, schemas={missing_baseline_schemas}"
              )

          for path in list(baseline_paths):
              baseline_paths[path] = generated_paths[path]
          for name in list(baseline_schemas):
              baseline_schemas[name] = generated_schemas[name]

          baseline_path.write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          def digest(value):
              encoded = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          for manifest_path in sorted((root / "docs" / "openapi").glob("*-manifest.json")):
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              for path in list(manifest.get("paths", {})):
                  if path not in generated_paths:
                      raise SystemExit(
                          f"Refusing to remove reviewed manifest path {path} from {manifest_path}"
                      )
                  manifest["paths"][path] = digest(generated_paths[path])
              for name in list(manifest.get("schemas", {})):
                  if name not in generated_schemas:
                      raise SystemExit(
                          f"Refusing to remove reviewed manifest schema {name} from {manifest_path}"
                      )
                  manifest["schemas"][name] = digest(generated_schemas[name])
              manifest_path.write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
          python scripts/verify_openapi_contract.py
      - name: Commit only reviewed contract snapshots
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          allowed='^( M|M |A |AM|MM) (openapi\.json|docs/openapi/[^ ]+-manifest\.json)$'
          unexpected="$(git status --porcelain --untracked-files=no | grep -Ev "$allowed" || true)"
          if test -n "$unexpected"; then
            echo "Refusing to commit changes outside reviewed contract snapshots:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- openapi.json docs/openapi; then
            echo "Reviewed contract snapshots are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json docs/openapi
          git commit -m "docs(api): refresh reviewed OpenAPI snapshots"
          git push origin "HEAD:${BRANCH_NAME}"
