name: normalize-compliance-api-script

on:
  push:
    branches:
      - claude/system-review-architecture-8vo66p
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-compliance-api-script-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.repository == 'appolon1908-hue/Moneybee-Backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
          POSTGRES_DB: moneybee_normalize
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee_normalize"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee@127.0.0.1:5432/moneybee_normalize
      AUTO_CREATE_SCHEMA: "false"
      LOCAL_AUTH_BYPASS: "true"
      LOCAL_IDENTITY_ENFORCEMENT: "false"
      ENABLE_EXTERNAL_DELIVERY: "false"
      CREDIT_LIVE_PULL: "false"
      LENDERS_LIVE_SUBMISSION: "false"
      ESIGN_LIVE_SEND: "false"
      FIELD_ENCRYPTION_KEYS_JSON: '{"1":"zJ8vQ3mK7pR2sT5wX9aB1cD4eF6gH0iJ2kL4mN6oP8q="}'
      FIELD_ENCRYPTION_ACTIVE_KEY_VERSION: "1"
    steps:
      - name: Allow deterministic API apply to finish
        run: sleep 600
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/system-review-architecture-8vo66p
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Normalize generator and regenerate source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_compliance_api_completion.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'from app.db import Db',
              'from app.admin_routes import Db',
          )
          path.write_text(source, encoding='utf-8')
          PY
          python scripts/apply_compliance_api_completion.py
      - name: Install and validate regenerated branch
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff format \
            app/main.py \
            app/admin_routes.py \
            app/schemas.py \
            app/compliance_routes.py \
            tests/test_commercial_financing_disclosure.py \
            tests/test_compliance_operations.py \
            scripts/apply_compliance_api_completion.py \
            scripts/sync_compliance_openapi_manifest.py
          python -m ruff check app tests migrations scripts
          python -m compileall -q app tests migrations scripts
          python scripts/check_no_private_keys.py
          python scripts/sync_compliance_openapi_manifest.py
          python scripts/generate_endpoint_catalog.py
          python scripts/sync_compliance_openapi_manifest.py --check
          python scripts/generate_endpoint_catalog.py --check
          alembic upgrade head
          alembic downgrade 20260823_0012
          alembic upgrade head
          python scripts/verify_openapi_contract.py
          python -m pytest -q
      - name: Commit reproducible source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/apply_compliance_api_completion.py \
            app/main.py \
            app/admin_routes.py \
            app/schemas.py \
            app/compliance_routes.py \
            tests/test_commercial_financing_disclosure.py \
            tests/test_compliance_operations.py \
            scripts/sync_compliance_openapi_manifest.py \
            docs/API_COMPLIANCE_OPERATIONS.md \
            docs/openapi/compliance-records-manifest.json \
            docs/API_ENDPOINT_CATALOG.md \
            .github/workflows/secure-ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "build(api): make compliance completion reproducible"
            git push origin HEAD:claude/system-review-architecture-8vo66p
          fi
