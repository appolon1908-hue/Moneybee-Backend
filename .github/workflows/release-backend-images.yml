name: release-backend-images

on:
  push:
    branches:
      - "release/staging"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: moneybee-backend-staging-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/release/staging'
    environment: staging-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHON_BASE_IMAGE: ${{ vars.PYTHON_BASE_IMAGE }}
      TRIVY_IMAGE: ${{ vars.TRIVY_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Verify immutable build inputs and release branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/release/staging"
          python - <<'PY'
          import os
          import re

          for name in ("PYTHON_BASE_IMAGE", "TRIVY_IMAGE"):
              value = os.environ.get(name, "")
              if not re.search(r"@sha256:[0-9a-f]{64}$", value):
                  raise SystemExit(f"{name} must be pinned by digest")
          PY

      - name: Authenticate to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish backend-owned images
        id: build
        run: |
          set -euo pipefail
          mkdir -p dist
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          build_one() {
            target="$1"
            name="$2"
            image="ghcr.io/$owner/$name"
            metadata="dist/$target.metadata.json"

            docker buildx build \
              --file docker/Dockerfile.release \
              --target "$target" \
              --build-arg "PYTHON_BASE_IMAGE=$PYTHON_BASE_IMAGE" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.created=$(date -u +%FT%TZ)" \
              --tag "$image:sha-$GITHUB_SHA" \
              --provenance=false \
              --sbom=false \
              --push \
              --metadata-file "$metadata" \
              .

            digest="$(jq -r '."containerimage.digest"' "$metadata")"
            test "$digest" != "null"
            printf '%s_digest=%s\n' "$target" "$digest" >>"$GITHUB_OUTPUT"
            printf '%s_name=%s\n' "$target" "$image" >>"$GITHUB_OUTPUT"
          }

          build_one api moneybee-api
          build_one worker moneybee-worker
          build_one migrate moneybee-migrate

      - name: Scan API image and export CycloneDX SBOM
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$PWD/dist:/work" \
            "$TRIVY_IMAGE" image --sbom-sources= --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "${{ steps.build.outputs.api_name }}@${{ steps.build.outputs.api_digest }}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$PWD/dist:/work" \
            "$TRIVY_IMAGE" image --sbom-sources= --format cyclonedx --output /work/api.cdx.json \
            "${{ steps.build.outputs.api_name }}@${{ steps.build.outputs.api_digest }}"

      - name: Scan worker image and export CycloneDX SBOM
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$PWD/dist:/work" \
            "$TRIVY_IMAGE" image --sbom-sources= --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "${{ steps.build.outputs.worker_name }}@${{ steps.build.outputs.worker_digest }}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$PWD/dist:/work" \
            "$TRIVY_IMAGE" image --sbom-sources= --format cyclonedx --output /work/worker.cdx.json \
            "${{ steps.build.outputs.worker_name }}@${{ steps.build.outputs.worker_digest }}"

      - name: Scan migrate image and export CycloneDX SBOM
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$PWD/dist:/work" \
            "$TRIVY_IMAGE" image --sbom-sources= --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "${{ steps.build.outputs.migrate_name }}@${{ steps.build.outputs.migrate_digest }}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$PWD/dist:/work" \
            "$TRIVY_IMAGE" image --sbom-sources= --format cyclonedx --output /work/migrate.cdx.json \
            "${{ steps.build.outputs.migrate_name }}@${{ steps.build.outputs.migrate_digest }}"

      - name: Record SBOM and reviewed configuration checksums
        id: checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum api.cdx.json worker.cdx.json migrate.cdx.json >sbom.sha256
          )

          config_files=(
            docker/Dockerfile.release
            deploy/Caddyfile.staging
            deploy/compose.backend.yml
            deploy/compose.data.yml
            deploy/compose.edge.yml
            ops/deploy-staging.sh
            ops/render-compose-env.py
            ops/verify-runtime-env.py
          )
          : >dist/configuration-files.sha256
          for file in "${config_files[@]}"; do
            test -f "$file"
            sha256sum "$file" >>dist/configuration-files.sha256
          done
          configuration_checksum="$(sha256sum dist/configuration-files.sha256 | awk '{print $1}')"
          printf '%s\n' "$configuration_checksum" >dist/configuration.aggregate.sha256
          echo "configuration_checksum=$configuration_checksum" >>"$GITHUB_OUTPUT"

      - name: Attest API build provenance
        id: api_provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.api_name }}
          subject-digest: ${{ steps.build.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest worker build provenance
        id: worker_provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.worker_name }}
          subject-digest: ${{ steps.build.outputs.worker_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest migrate build provenance
        id: migrate_provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.migrate_name }}
          subject-digest: ${{ steps.build.outputs.migrate_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest API SBOM
        id: api_sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.build.outputs.api_name }}
          subject-digest: ${{ steps.build.outputs.api_digest }}
          sbom-path: dist/api.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest worker SBOM
        id: worker_sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.build.outputs.worker_name }}
          subject-digest: ${{ steps.build.outputs.worker_digest }}
          sbom-path: dist/worker.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest migrate SBOM
        id: migrate_sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.build.outputs.migrate_name }}
          subject-digest: ${{ steps.build.outputs.migrate_digest }}
          sbom-path: dist/migrate.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Preserve signed attestation bundles
        run: |
          set -euo pipefail
          cp "${{ steps.api_provenance.outputs.bundle-path }}" dist/api.provenance.bundle.json
          cp "${{ steps.worker_provenance.outputs.bundle-path }}" dist/worker.provenance.bundle.json
          cp "${{ steps.migrate_provenance.outputs.bundle-path }}" dist/migrate.provenance.bundle.json
          cp "${{ steps.api_sbom.outputs.bundle-path }}" dist/api.sbom.bundle.json
          cp "${{ steps.worker_sbom.outputs.bundle-path }}" dist/worker.sbom.bundle.json
          cp "${{ steps.migrate_sbom.outputs.bundle-path }}" dist/migrate.sbom.bundle.json

      - name: Verify signed provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_one() {
            target="$1"
            image="$2"
            digest="$3"
            gh attestation verify "oci://$image@$digest" \
              -R "$GITHUB_REPOSITORY" --format json \
              >"dist/$target.provenance-verification.json"
            gh attestation verify "oci://$image@$digest" \
              -R "$GITHUB_REPOSITORY" \
              --predicate-type "https://cyclonedx.org/bom" \
              --format json \
              >"dist/$target.sbom-verification.json"
          }
          verify_one api "${{ steps.build.outputs.api_name }}" "${{ steps.build.outputs.api_digest }}"
          verify_one worker "${{ steps.build.outputs.worker_name }}" "${{ steps.build.outputs.worker_digest }}"
          verify_one migrate "${{ steps.build.outputs.migrate_name }}" "${{ steps.build.outputs.migrate_digest }}"

      - name: Write immutable backend release manifest
        env:
          API_NAME: ${{ steps.build.outputs.api_name }}
          API_DIGEST: ${{ steps.build.outputs.api_digest }}
          WORKER_NAME: ${{ steps.build.outputs.worker_name }}
          WORKER_DIGEST: ${{ steps.build.outputs.worker_digest }}
          MIGRATE_NAME: ${{ steps.build.outputs.migrate_name }}
          MIGRATE_DIGEST: ${{ steps.build.outputs.migrate_digest }}
          CONFIGURATION_CHECKSUM: ${{ steps.checksums.outputs.configuration_checksum }}
          API_PROVENANCE_ID: ${{ steps.api_provenance.outputs.attestation-id }}
          API_PROVENANCE_URL: ${{ steps.api_provenance.outputs.attestation-url }}
          WORKER_PROVENANCE_ID: ${{ steps.worker_provenance.outputs.attestation-id }}
          WORKER_PROVENANCE_URL: ${{ steps.worker_provenance.outputs.attestation-url }}
          MIGRATE_PROVENANCE_ID: ${{ steps.migrate_provenance.outputs.attestation-id }}
          MIGRATE_PROVENANCE_URL: ${{ steps.migrate_provenance.outputs.attestation-url }}
          API_SBOM_ID: ${{ steps.api_sbom.outputs.attestation-id }}
          API_SBOM_URL: ${{ steps.api_sbom.outputs.attestation-url }}
          WORKER_SBOM_ID: ${{ steps.worker_sbom.outputs.attestation-id }}
          WORKER_SBOM_URL: ${{ steps.worker_sbom.outputs.attestation-url }}
          MIGRATE_SBOM_ID: ${{ steps.migrate_sbom.outputs.attestation-id }}
          MIGRATE_SBOM_URL: ${{ steps.migrate_sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          def file_sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          manifest = {
              "schema_version": 2,
              "status": "PUBLISHED_ATTESTED_VERIFIED",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["GITHUB_SHA"],
              "release_branch": os.environ["GITHUB_REF_NAME"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "created_at": datetime.now(UTC).isoformat(),
              "images": {
                  "api": os.environ["API_NAME"] + "@" + os.environ["API_DIGEST"],
                  "worker": os.environ["WORKER_NAME"] + "@" + os.environ["WORKER_DIGEST"],
                  "migrate": os.environ["MIGRATE_NAME"] + "@" + os.environ["MIGRATE_DIGEST"],
              },
              "sboms": {
                  "api": {
                      "path": "api.cdx.json",
                      "sha256": file_sha256("dist/api.cdx.json"),
                      "attestation_id": os.environ["API_SBOM_ID"],
                      "attestation_url": os.environ["API_SBOM_URL"],
                  },
                  "worker": {
                      "path": "worker.cdx.json",
                      "sha256": file_sha256("dist/worker.cdx.json"),
                      "attestation_id": os.environ["WORKER_SBOM_ID"],
                      "attestation_url": os.environ["WORKER_SBOM_URL"],
                  },
                  "migrate": {
                      "path": "migrate.cdx.json",
                      "sha256": file_sha256("dist/migrate.cdx.json"),
                      "attestation_id": os.environ["MIGRATE_SBOM_ID"],
                      "attestation_url": os.environ["MIGRATE_SBOM_URL"],
                  },
              },
              "provenance": {
                  "api": {
                      "attestation_id": os.environ["API_PROVENANCE_ID"],
                      "attestation_url": os.environ["API_PROVENANCE_URL"],
                  },
                  "worker": {
                      "attestation_id": os.environ["WORKER_PROVENANCE_ID"],
                      "attestation_url": os.environ["WORKER_PROVENANCE_URL"],
                  },
                  "migrate": {
                      "attestation_id": os.environ["MIGRATE_PROVENANCE_ID"],
                      "attestation_url": os.environ["MIGRATE_PROVENANCE_URL"],
                  },
              },
              "signature": {
                  "mechanism": "sigstore-oidc-github-artifact-attestation",
                  "provenance_verified": True,
                  "sbom_attestations_verified": True,
              },
              "configuration": {
                  "aggregate_sha256": os.environ["CONFIGURATION_CHECKSUM"],
                  "per_file_checksums": "configuration-files.sha256",
              },
              "previous_rollback": {
                  "status": "PENDING_READ_ONLY_RUNTIME_INVENTORY",
                  "images": None,
              },
              "production_authorized": False,
              "server_contact_authorized": False,
              "external_effects_enabled": False,
          }

          Path("dist/backend-release.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' |
              sort |
              xargs sha256sum >SHA256SUMS
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moneybee-backend-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
