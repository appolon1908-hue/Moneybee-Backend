name: full-audit-snapshot

on:
  push:
    branches:
      - automation/full-audit-snapshot-20260826

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: moneybee-backend-full-audit-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
