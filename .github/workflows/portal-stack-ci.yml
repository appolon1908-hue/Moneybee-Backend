name: Portal stack CI

on:
  push:
    branches:
      - "feature/portal-foundation"
      - "feature/borrower-portal-api"
      - "feature/lender-bank-portal-api"
      - "feature/admin-operations-api"
      - "feature/provider-webhook-gateway"
  pull_request:
    branches:
      - "auth/local-identity-tenancy"
      - "feature/portal-foundation"
      - "feature/borrower-portal-api"
      - "feature/lender-bank-portal-api"
      - "feature/admin-operations-api"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
          POSTGRES_DB: moneybee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee@127.0.0.1:5432/moneybee_test
      APP_ENV: test
      CREDIT_LIVE_PULL: "false"
      LENDERS_LIVE_SUBMISSION: "false"
      ESIGN_LIVE_SEND: "false"
      MONEYBEE_DOCUMENT_BUCKET: test-private-bucket
      MONEYBEE_WEBHOOK_SECRET_TEST_PROVIDER: test-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q app tests migrations
      - name: Lint
        run: python -m ruff check app tests migrations
      - name: Upgrade database
        run: alembic upgrade head
      - name: Test
        run: python -m pytest -q
      - name: Verify reversible portal migration
        run: |
          alembic downgrade 20260823_0012
          alembic upgrade head
      - name: Verify OpenAPI contract
        run: |
          cp openapi.json /tmp/openapi.before.json
          python scripts/export_openapi.py
          diff -u /tmp/openapi.before.json openapi.json
