name: Portal stack CI

on:
  push:
    branches:
      - "release/portal-stack-consolidated"
      - "feature/business-lender-crm-delivery"
      - "feature/forms-codestra-middleware-delivery"
  pull_request:
    branches:
      - "auth/local-identity-tenancy"
      - "release/portal-stack-consolidated"
      - "feature/business-lender-crm-delivery"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
          POSTGRES_DB: moneybee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee@127.0.0.1:5432/moneybee_test
      APP_ENV: test
      AUTO_CREATE_SCHEMA: "false"
      LOCAL_AUTH_BYPASS: "true"
      CREDIT_LIVE_PULL: "false"
      LENDERS_LIVE_SUBMISSION: "false"
      ESIGN_LIVE_SEND: "false"
      ENABLE_EXTERNAL_DELIVERY: "false"
      MONEYBEE_DOCUMENT_BUCKET: test-private-bucket
      MONEYBEE_WEBHOOK_SECRET_TEST_PROVIDER: test-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q app tests migrations
      - name: Lint
        run: python -m ruff check app tests migrations
      - name: Upgrade database
        run: alembic upgrade head
      - name: Test
        run: python -m pytest -q
      - name: Verify reversible migrations
        run: |
          alembic downgrade 20260823_0012
          alembic upgrade head
      - name: Verify OpenAPI contract and additive manifests
        run: python scripts/verify_openapi_contract.py
      - name: Build backend image
        run: docker build -t moneybee-backend:test .
