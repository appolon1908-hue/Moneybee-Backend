name: finalize-compliance-api

on:
  push:
    branches:
      - claude/system-review-architecture-8vo66p
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: finalize-compliance-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.repository == 'appolon1908-hue/Moneybee-Backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
          POSTGRES_DB: moneybee_finalize
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee_finalize"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee@127.0.0.1:5432/moneybee_finalize
      AUTO_CREATE_SCHEMA: "false"
      LOCAL_AUTH_BYPASS: "true"
      LOCAL_IDENTITY_ENFORCEMENT: "false"
      ENABLE_EXTERNAL_DELIVERY: "false"
      CREDIT_LIVE_PULL: "false"
      LENDERS_LIVE_SUBMISSION: "false"
      ESIGN_LIVE_SEND: "false"
      FIELD_ENCRYPTION_KEYS_JSON: '{"1":"zJ8vQ3mK7pR2sT5wX9aB1cD4eF6gH0iJ2kL4mN6oP8q="}'
      FIELD_ENCRYPTION_ACTIVE_KEY_VERSION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/system-review-architecture-8vo66p
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Dispatch implementation workflow and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run complete-compliance-api.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref claude/system-review-architecture-8vo66p
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow complete-compliance-api.yml \
              --branch claude/system-review-architecture-8vo66p \
              --event workflow_dispatch \
              --limit 5 \
              --json databaseId,createdAt \
              --jq ".[] | select(.createdAt >= \"$started\") | .databaseId" \
              | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Refresh exact completed branch
        run: |
          git fetch origin claude/system-review-architecture-8vo66p
          git reset --hard origin/claude/system-review-architecture-8vo66p
          test -f app/compliance_routes.py
          test -f tests/test_compliance_operations.py
          test -f scripts/sync_compliance_openapi_manifest.py
          test -f docs/API_COMPLIANCE_OPERATIONS.md
      - name: Put migration and contract checks before stateful tests
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/secure-ci.yml')
          source = path.read_text(encoding='utf-8')

          source = re.sub(
              r'\n  authenticated-acknowledgment-hardening:.*?(?=\n  [a-zA-Z0-9_-]+:)',
              '\n',
              source,
              flags=re.DOTALL,
          )

          app_match = re.search(
              r'(?ms)^  application:\n(?P<body>.*?)(?=^  [a-zA-Z0-9_-]+:\n)',
              source,
          )
          if not app_match:
              raise SystemExit('secure-ci application job was not found')
          body = app_match.group('body')

          def step(name: str) -> tuple[str, tuple[int, int]]:
              match = re.search(
                  rf'(?ms)^      - name: {re.escape(name)}\n.*?(?=^      - name: |^  [a-zA-Z0-9_-]+:\n|\Z)',
                  body,
              )
              if not match:
                  raise SystemExit(f'secure-ci step not found: {name}')
              return match.group(0), match.span()

          upgrade, _ = step('Upgrade application test database')
          tests, _ = step('Application tests')
          migration, _ = step('Migration and OpenAPI gates')

          first = min(body.index(upgrade), body.index(tests), body.index(migration))
          last = max(
              body.index(upgrade) + len(upgrade),
              body.index(tests) + len(tests),
              body.index(migration) + len(migration),
          )
          ordered = upgrade.rstrip() + '\n' + migration.rstrip() + '\n' + tests.rstrip() + '\n'
          body = body[:first] + ordered + body[last:]
          source = source[:app_match.start('body')] + body + source[app_match.end('body'):]
          path.write_text(source, encoding='utf-8')
          PY
      - name: Install and validate exact branch
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m ruff check app tests migrations scripts
          python -m ruff format --check app tests migrations scripts
          python -m compileall -q app tests migrations scripts
          python scripts/check_no_private_keys.py
          python scripts/sync_compliance_openapi_manifest.py --check
          python scripts/generate_endpoint_catalog.py --check
          alembic upgrade head
          alembic downgrade 20260823_0012
          alembic upgrade head
          test "$(alembic heads | grep -c '(head)')" -eq 1
          python scripts/verify_openapi_contract.py
          python -m pytest -q
      - name: Commit final CI ordering
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/secure-ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: validate migrations and contracts before stateful tests"
            git push origin HEAD:claude/system-review-architecture-8vo66p
          fi
