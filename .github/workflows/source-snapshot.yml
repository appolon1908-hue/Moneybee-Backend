name: source-snapshot

on:
  push:
    branches:
      - automation/source-snapshot-20260826

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package checked-out source
        run: zip -q -r moneybee-backend-source.zip . -x '.git/*'
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: moneybee-backend-source
          path: moneybee-backend-source.zip
          if-no-files-found: error
          retention-days: 1
