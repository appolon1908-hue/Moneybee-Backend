name: apply-codestra-sdk-integration

on:
  push:
    branches:
      - "release/moneybee-repository-complete-20260902"
    paths-ignore:
      - "app/config.py"
      - ".env.example"
      - ".env.production.example"
      - "ops/verify-runtime-env.py"

permissions:
  contents: write

concurrency:
  group: apply-codestra-sdk-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply narrow reviewed configuration edits
        run: python scripts/apply_codestra_sdk_integration.py
      - name: Validate integrated source before committing
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q app tests scripts ops
          python -m ruff check app tests scripts ops
          python -m pytest -q tests/test_codestra_sdk_integration.py
      - name: Commit only the reviewed integration outputs
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          allowed='^( M|M |A |AM|MM) (app/config\.py|\.env\.example|\.env\.production\.example|ops/verify-runtime-env\.py)$'
          unexpected="$(git status --porcelain --untracked-files=no | grep -Ev "$allowed" || true)"
          if test -n "$unexpected"; then
            echo "Refusing to commit changes outside reviewed SDK configuration outputs:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- app/config.py .env.example .env.production.example ops/verify-runtime-env.py; then
            echo "SDK configuration integration is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/config.py .env.example .env.production.example ops/verify-runtime-env.py
          git commit -m "feat(integration): apply fail-closed Codestra SDK configuration"
          git push origin "HEAD:${BRANCH_NAME}"
