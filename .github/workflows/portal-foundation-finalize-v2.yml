name: Portal foundation finalization v2

on:
  push:
    branches:
      - feature/portal-foundation

permissions:
  contents: write

concurrency:
  group: portal-foundation-finalization-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
          POSTGRES_DB: moneybee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://moneybee:moneybee@localhost:5432/moneybee_test
      ENVIRONMENT: test
      MONEYBEE_ALLOW_TEST_AUTH: "true"
      LIVE_WRITES: "false"
      ODOO_WRITE: "false"
      ENABLE_EXTERNAL_DELIVERY: "false"
      N8N_DELIVERY_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portal-foundation
          fetch-depth: 0

      - name: Correct foundation ownership files
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("app/main.py")
          text = main.read_text()
          if "portal_models" not in text:
              for marker in (
                  "from app import identity_models, models",
                  "from app import models, identity_models",
              ):
                  if marker in text:
                      text = text.replace(marker, marker + ", portal_models", 1)
                      break
              else:
                  text = "from app import portal_models\n" + text
          portal_import = "from app.portal_router import router as portal_router"
          if portal_import not in text:
              marker = "from app.integration_routes import router as integration_router"
              if marker not in text:
                  raise SystemExit("Integration router import marker not found")
              text = text.replace(marker, marker + "\n" + portal_import, 1)
          registration = 'app.include_router(portal_router, prefix="/api/v2")'
          if registration not in text:
              for marker in (
                  'app.include_router(integration_router, prefix="/api/v2")',
                  "app.include_router(integration_router, prefix='/api/v2')",
              ):
                  if marker in text:
                      text = text.replace(marker, marker + "\n" + registration, 1)
                      break
              else:
                  raise SystemExit("API v2 integration registration marker not found")
          main.write_text(text)

          models = Path("app/portal_models.py")
          text = models.read_text()
          for name in (
              "PortalTask",
              "PortalNotification",
              "PortalConversation",
              "PortalMessage",
              "PortalUploadSession",
              "ProviderWebhookReceipt",
          ):
              text = text.replace(
                  f"class {name}(Base, PortalRecord):",
                  f"class {name}(PortalRecord, Base):",
              )
          models.write_text(text)

          schemas = Path("app/portal_schemas.py")
          text = schemas.read_text()
          marker = "class UploadSessionRead(PortalModel):\n    id: uuid.UUID\n"
          replacement = "class UploadSessionRead(PortalModel):\n    id: uuid.UUID\n    version: int\n"
          if marker in text and replacement not in text:
              text = text.replace(marker, replacement, 1)
          schemas.write_text(text)

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          if "boto3" not in text:
              marker = "dependencies = ["
              if marker not in text:
                  raise SystemExit("pyproject dependency array not found")
              text = text.replace(marker, marker + '\n  "boto3>=1.35,<2",', 1)
          pyproject.write_text(text)
          PY

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Normalize feature code
        run: |
          if python -m ruff --version >/dev/null 2>&1; then
            python -m ruff check --fix \
              app/portal_permissions.py app/portal_models.py app/portal_schemas.py \
              app/portal_storage.py app/portal_core.py app/portal_router.py \
              tests/test_portal_foundation.py
            python -m ruff format \
              app/portal_permissions.py app/portal_models.py app/portal_schemas.py \
              app/portal_storage.py app/portal_core.py app/portal_router.py \
              tests/test_portal_foundation.py
          fi

      - name: Validate foundation
        id: validate
        shell: bash
        run: |
          set +e
          status=0
          python -m compileall -q app migrations tests || status=$?
          pytest -q tests/test_portal_foundation.py || status=$?
          alembic upgrade 20260826_0013 || status=$?
          alembic downgrade 20260823_0012 || status=$?
          alembic upgrade 20260826_0013 || status=$?
          python scripts/export_openapi.py || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record and commit result
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          mkdir -p docs/evidence
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          code = int(os.environ.get("VALIDATION_STATUS", "1"))
          payload = {
              "work_package": "feature/portal-foundation",
              "status": "PASS" if code == 0 else "FAIL",
              "validation_exit_code": code,
              "syntax": "EXECUTED",
              "focused_tests": "EXECUTED",
              "postgres_migration_upgrade": "EXECUTED",
              "postgres_migration_downgrade_reupgrade": "EXECUTED",
              "openapi_export": "EXECUTED",
              "live_capabilities_enabled": [],
              "production_deployed": False,
              "recorded_at": datetime.now(UTC).isoformat(),
          }
          Path("docs/evidence/portal-foundation-validation.json").write_text(
              json.dumps(payload, indent=2) + "\n"
          )
          PY
          rm -f .github/workflows/portal-bootstrap-once.yml
          rm -f .github/workflows/portal-bootstrap-trigger.yml
          rm -f .github/workflows/portal-foundation-finalize-v2.yml
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/main.py app/portal_models.py app/portal_schemas.py pyproject.toml \
            app/portal_permissions.py app/portal_storage.py app/portal_core.py app/portal_router.py \
            tests/test_portal_foundation.py openapi.json \
            docs/evidence/portal-foundation-validation.json \
            .github/workflows/portal-bootstrap-once.yml \
            .github/workflows/portal-bootstrap-trigger.yml \
            .github/workflows/portal-foundation-finalize-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(portal): finalize foundation with validation evidence"
            git push origin HEAD:feature/portal-foundation
          fi

      - name: Fail if validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1
