name: backend-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: moneybee
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee@localhost:5432/moneybee
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -c 'from app.main import app; import json; open("openapi.json","w").write(json.dumps(app.openapi(), sort_keys=True, indent=2))'
      - run: docker build -t moneybee-api:${{ github.sha }} .
