name: backend-ci

on:
  pull_request:
  push:
    branches: ["main", "planning/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: python -m ruff check app tests migrations scripts ops
      - run: pytest -q
      - name: Smoke-test critical API surfaces
        run: python scripts/smoke_api.py
      - name: Verify OpenAPI contract and additive manifests
        run: |
          python scripts/verify_openapi_contract.py
          python scripts/generate_endpoint_catalog.py --check
          python scripts/check_no_private_keys.py
          python scripts/check_identity_email_readiness.py
      - name: Upload reviewed OpenAPI sources
        uses: actions/upload-artifact@v4
        with:
          name: moneybee-openapi
          path: |
            openapi.json
            docs/openapi/*-manifest.json
      - name: Verify migration upgrade and rollback
        env:
          APP_ENV: test
          AUTO_CREATE_SCHEMA: "false"
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: sqlite+aiosqlite:///./migration-test.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python -m compileall -q app tests migrations scripts ops
      - run: docker build -t moneybee-backend:test .

  postgres-identity-tenancy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTO_CREATE_SCHEMA: "false"
      LOCAL_AUTH_BYPASS: "false"
      LOCAL_IDENTITY_ENFORCEMENT: "true"
      DATABASE_URL: postgresql+asyncpg://moneybee_migrator:migrator_test@localhost:5432/moneybee
    steps:
      - uses: actions/checkout@v4
      - name: Start runner PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createdb moneybee
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d moneybee -c \
            'CREATE ROLE moneybee_legacy NOLOGIN; CREATE TABLE public.legacy_owned(id integer); ALTER TABLE public.legacy_owned OWNER TO moneybee_legacy;'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d moneybee \
            -v migrator_password=migrator_test -v runtime_password=runtime_test \
            -f deploy/postgres/moneybee_roles.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d moneybee \
            -v migrator_password=migrator_test -v runtime_password=runtime_test \
            -f deploy/postgres/moneybee_roles.sql
          PGPASSWORD=migrator_test psql -h localhost -U moneybee_migrator -d moneybee \
            -v ON_ERROR_STOP=1 -c 'ALTER TABLE public.legacy_owned ADD COLUMN migrated boolean DEFAULT false; DROP TABLE public.legacy_owned'
          pg_isready --host=localhost --port=5432 --username=moneybee_migrator
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Verify the historical identity migration boundary
        run: |
          alembic upgrade 20260823_0011
          alembic upgrade 20260823_0012
      - name: Upgrade to the current ORM schema
        run: |
          alembic upgrade head
          alembic check
      - name: Verify migration 0023 legacy fail-closed and compatibility paths
        run: |
          sudo -u postgres createdb --owner=moneybee_migrator moneybee_legacy
          sudo -u postgres createdb --owner=moneybee_migrator moneybee_compatible
          for database in moneybee_legacy moneybee_compatible; do
            DATABASE_URL="postgresql+asyncpg://moneybee_migrator:migrator_test@localhost:5432/$database" alembic upgrade 20260901_0022
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d "$database" -c \
              'ALTER TABLE bank_provider_states RENAME COLUMN credential_reference TO access_token_ciphertext; ALTER TABLE bank_provider_states ALTER COLUMN access_token_ciphertext TYPE text;'
          done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d moneybee_legacy <<'SQL'
          SET session_replication_role = replica;
          INSERT INTO bank_provider_states
            (id, created_at, updated_at, connection_id, provider, access_token_ciphertext, metadata_payload)
          VALUES
            ('00000000-0000-0000-0000-000000000023', now(), now(), '00000000-0000-0000-0000-000000000024', 'fixture', 'legacy-fixture', '{}');
          SET session_replication_role = origin;
          SQL
          if DATABASE_URL='postgresql+asyncpg://moneybee_migrator:migrator_test@localhost:5432/moneybee_legacy' alembic upgrade head; then
            echo 'Migration accepted unresolved legacy credential rows' >&2
            exit 1
          fi
          DATABASE_URL='postgresql+asyncpg://moneybee_migrator:migrator_test@localhost:5432/moneybee_compatible' alembic upgrade head
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d moneybee_compatible <<'SQL'
          SET session_replication_role = replica;
          INSERT INTO bank_provider_states
            (id, created_at, updated_at, connection_id, provider, credential_reference, metadata_payload)
          VALUES
            ('00000000-0000-0000-0000-000000000025', now(), now(), '00000000-0000-0000-0000-000000000026', 'fixture', 'secret://verified/fixture', '{}');
          SET session_replication_role = origin;
          SQL
          if DATABASE_URL='postgresql+asyncpg://moneybee_migrator:migrator_test@localhost:5432/moneybee_compatible' alembic downgrade 20260901_0022; then
            echo 'Downgrade stranded an external credential reference' >&2
            exit 1
          fi
          before="$(PGPASSWORD=migrator_test psql -h localhost -U moneybee_migrator -d moneybee_compatible -Atc "select column_name from information_schema.columns where table_name='bank_provider_states' order by ordinal_position")"
          DATABASE_URL='postgresql+asyncpg://moneybee_migrator:migrator_test@localhost:5432/moneybee_compatible' alembic upgrade head
          after="$(PGPASSWORD=migrator_test psql -h localhost -U moneybee_migrator -d moneybee_compatible -Atc "select column_name from information_schema.columns where table_name='bank_provider_states' order by ordinal_position")"
          test "$before" = "$after"
      - name: Test identity downgrade and current forward-fix path
        run: |
          alembic downgrade 20260823_0011
          alembic upgrade head
      - name: Test complete application under least-privilege runtime identity
        env:
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: postgresql+asyncpg://moneybee_runtime:runtime_test@localhost:5432/moneybee
        run: pytest -q
      - name: Assert runtime cannot perform DDL or administrative operations
        env:
          PGPASSWORD: runtime_test
        run: |
          ! psql -h localhost -U moneybee_runtime -d moneybee -c 'CREATE TABLE runtime_must_not_create(id integer)'
          ! psql -h localhost -U moneybee_runtime -d moneybee -c 'TRUNCATE capability_flags'
          ! psql -h localhost -U moneybee_runtime -d moneybee -c 'GRANT moneybee_runtime TO moneybee_migrator'
          test "$(psql -h localhost -U moneybee_runtime -d moneybee -Atc "select rolsuper or rolcreatedb or rolcreaterole or rolreplication or rolbypassrls from pg_roles where rolname=current_user")" = "f"
      - name: Test empty database to head
        run: |
          sudo -u postgres createdb --owner=moneybee_migrator moneybee_empty
          DATABASE_URL='postgresql+asyncpg://moneybee_migrator:migrator_test@localhost:5432/moneybee_empty' alembic upgrade head
          DATABASE_URL='postgresql+asyncpg://moneybee_migrator:migrator_test@localhost:5432/moneybee_empty' alembic check

  containers:
    needs: [verify, postgres-identity-tenancy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [api, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend ${{ matrix.role }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.role }}
          load: true
          tags: moneybee-${{ matrix.role }}:ci
          cache-from: type=gha,scope=backend-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.role }}
      - name: Scan backend ${{ matrix.role }} image
        run: |
          docker run --rm moneybee-${{ matrix.role }}:ci python -c \
            "import importlib.metadata as m; assert tuple(map(int, m.version('msgpack').split('.'))) >= (1, 2, 1); assert tuple(map(int, m.version('setuptools').split('.'))) >= (78, 1, 1)"
      - name: Enforce backend vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: moneybee-${{ matrix.role }}:ci
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: moneybee-${{ matrix.role }}:ci
          format: cyclonedx-json
          output-file: moneybee-${{ matrix.role }}.sbom.cdx.json
          upload-artifact: false
      - name: Upload release SBOM
        uses: actions/upload-artifact@v4
        with:
          name: moneybee-${{ matrix.role }}-sbom
          path: moneybee-${{ matrix.role }}.sbom.cdx.json
