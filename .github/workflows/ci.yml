name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moneybee
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee@localhost:5432/moneybee
      REDIS_URL: redis://localhost:6379/0

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests scripts

      - name: Mypy
        run: mypy app

      - name: Migration
        run: |
          alembic upgrade head
          alembic current

      - name: Tests
        run: pytest -q

      - name: OpenAPI
        run: python scripts/export_openapi.py

      - name: Preserve OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: moneybee-openapi
          path: openapi.json
          if-no-files-found: error
          retention-days: 1

      - name: Dependency audit
        run: pip-audit

      - name: Docker build
        run: docker build -t moneybee-backend:${GITHUB_SHA} .
