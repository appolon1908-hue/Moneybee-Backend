name: backend-ci

on:
  pull_request:
  push:
    branches: ["main", "planning/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
      - name: Smoke-test critical API surfaces
        run: python scripts/smoke_api.py
      - name: Verify OpenAPI contract and additive manifests
        run: python scripts/verify_openapi_contract.py
      - name: Upload reviewed OpenAPI sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moneybee-openapi
          path: |
            openapi.json
            docs/openapi/*-manifest.json
      - name: Verify migration upgrade and rollback
        env:
          APP_ENV: test
          AUTO_CREATE_SCHEMA: "false"
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: sqlite+aiosqlite:///./migration-test.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python -m compileall -q app migrations
      - run: docker build -t moneybee-backend:test .

  postgres-identity-tenancy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTO_CREATE_SCHEMA: "false"
      LOCAL_AUTH_BYPASS: "false"
      LOCAL_IDENTITY_ENFORCEMENT: "true"
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee_test@localhost:5432/moneybee_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start runner PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER moneybee WITH PASSWORD 'moneybee_test'"
          sudo -u postgres createdb --owner=moneybee moneybee_test
          pg_isready --host=localhost --port=5432 --username=moneybee
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Verify the historical identity migration boundary
        run: |
          alembic upgrade 20260823_0011
          alembic upgrade 20260823_0012
      - name: Upgrade to the current ORM schema
        run: alembic upgrade head
      - name: Test identity, tenancy and verified account registration
        run: |
          pytest -q \
            tests/test_auth_identity.py \
            tests/test_identity_tenancy_postgres.py \
            tests/test_account_registration.py
      - name: Test portal boundaries and finance ledger on PostgreSQL
        env:
          LOCAL_AUTH_BYPASS: "true"
        run: |
          pytest -q \
            tests/test_portal_token_boundaries.py \
            tests/test_financial_ledger.py
      - name: Test identity downgrade and current forward-fix path
        run: |
          alembic downgrade 20260823_0011
          alembic upgrade head
      - name: Test empty database to head
        run: |
          alembic downgrade base
          alembic upgrade head

  containers:
    needs: [verify, postgres-identity-tenancy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [api, worker, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build backend ${{ matrix.role }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # pinned commit
        with:
          context: .
          target: ${{ matrix.role }}
          load: true
          tags: moneybee-${{ matrix.role }}:ci
          cache-from: type=gha,scope=backend-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.role }}
      - name: Scan backend ${{ matrix.role }} image
        run: |
          docker run --rm moneybee-${{ matrix.role }}:ci python -c \
            "import importlib.metadata as m; assert tuple(map(int, m.version('msgpack').split('.'))) >= (1, 2, 1); assert tuple(map(int, m.version('setuptools').split('.'))) >= (78, 1, 1)"
      - name: Enforce backend vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: moneybee-${{ matrix.role }}:ci
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
