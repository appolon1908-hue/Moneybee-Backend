name: backend-ci

on:
  pull_request:
  push:
    branches: ["main", "planning/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      # Unit/API tests intentionally use isolated local schema creation. Production
      # and migration verification remain fail-closed with AUTO_CREATE_SCHEMA=false.
      AUTO_CREATE_SCHEMA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
      - name: Generate OpenAPI contract
        run: python scripts/export_openapi.py
      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: moneybee-openapi
          path: openapi.json
      - name: Verify OpenAPI snapshot
        run: git diff --exit-code -- openapi.json
      - name: Verify migration upgrade and rollback
        env:
          APP_ENV: test
          AUTO_CREATE_SCHEMA: "false"
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: sqlite+aiosqlite:///./migration-test.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python -m compileall -q app migrations
      - run: docker build -t moneybee-backend:test .

  postgres-identity-tenancy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTO_CREATE_SCHEMA: "false"
      LOCAL_AUTH_BYPASS: "false"
      LOCAL_IDENTITY_ENFORCEMENT: "true"
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee_test@localhost:5432/moneybee_test
    steps:
      - uses: actions/checkout@v4
      - name: Start runner PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER moneybee WITH PASSWORD 'moneybee_test'"
          sudo -u postgres createdb --owner=moneybee moneybee_test
          pg_isready --host=localhost --port=5432 --username=moneybee
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Test current head to identity head
        run: |
          alembic upgrade 20260823_0011
          alembic upgrade 20260823_0012
      - run: pytest -q tests/test_auth_identity.py tests/test_identity_tenancy_postgres.py
      - name: Test identity downgrade and forward-fix path
        run: |
          alembic downgrade 20260823_0011
          alembic upgrade 20260823_0012
      - name: Test empty database to head
        run: |
          alembic downgrade base
          alembic upgrade head
