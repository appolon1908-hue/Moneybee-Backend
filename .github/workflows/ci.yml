name: backend-ci

on:
  pull_request:
  push:
    branches: ["main", "planning/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: ruff check app tests migrations
      - run: pytest -q
      - name: Smoke-test critical API surfaces
        run: python scripts/smoke_api.py
      - name: Verify OpenAPI contract and additive manifests
        run: python scripts/verify_openapi_contract.py
      - name: Upload reviewed OpenAPI sources
        uses: actions/upload-artifact@v4
        with:
          name: moneybee-openapi
          path: |
            openapi.json
            docs/openapi/*-manifest.json
      - name: Verify migration upgrade and rollback
        env:
          APP_ENV: test
          AUTO_CREATE_SCHEMA: "false"
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: sqlite+aiosqlite:///./migration-test.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python -m compileall -q app migrations
      - run: docker build -t moneybee-backend:test .

  postgres-identity-tenancy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTO_CREATE_SCHEMA: "false"
      LOCAL_AUTH_BYPASS: "false"
      LOCAL_IDENTITY_ENFORCEMENT: "true"
      DATABASE_URL: postgresql+asyncpg://moneybee_migrator:migrator_test@localhost:5432/moneybee_test
    steps:
      - uses: actions/checkout@v4
      - name: Start runner PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE USER moneybee_migrator WITH PASSWORD 'migrator_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE USER moneybee_runtime WITH PASSWORD 'runtime_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          SQL
          sudo -u postgres createdb --owner=moneybee_migrator moneybee_test
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d moneybee_test <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO moneybee_migrator;
          GRANT CONNECT ON DATABASE moneybee_test TO moneybee_runtime;
          GRANT USAGE ON SCHEMA public TO moneybee_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE moneybee_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO moneybee_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE moneybee_migrator IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO moneybee_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE moneybee_migrator IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO moneybee_runtime;
          SQL
          pg_isready --host=localhost --port=5432 --username=moneybee_migrator
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Verify the historical identity migration boundary
        run: |
          alembic upgrade 20260823_0011
          alembic upgrade 20260823_0012
      - name: Upgrade to the current ORM schema
        run: |
          alembic upgrade head
          alembic check
      - name: Test complete application under least-privilege runtime identity
        env:
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: postgresql+asyncpg://moneybee_runtime:runtime_test@localhost:5432/moneybee_test
        run: pytest -q
      - name: Assert runtime cannot perform DDL or administrative operations
        env:
          PGPASSWORD: runtime_test
        run: |
          ! psql -h localhost -U moneybee_runtime -d moneybee_test -c 'CREATE TABLE runtime_must_not_create(id integer)'
          test "$(psql -h localhost -U moneybee_runtime -d moneybee_test -Atc "select rolsuper or rolcreatedb or rolcreaterole or rolreplication or rolbypassrls from pg_roles where rolname=current_user")" = "f"
      - name: Test identity downgrade and current forward-fix path
        run: |
          alembic downgrade 20260823_0011
          alembic upgrade head
      - name: Test empty database to head
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  containers:
    needs: [verify, postgres-identity-tenancy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [api, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend ${{ matrix.role }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.role }}
          load: true
          tags: moneybee-${{ matrix.role }}:ci
          cache-from: type=gha,scope=backend-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.role }}
      - name: Scan backend ${{ matrix.role }} image
        run: |
          docker run --rm moneybee-${{ matrix.role }}:ci python -c \
            "import importlib.metadata as m; assert tuple(map(int, m.version('msgpack').split('.'))) >= (1, 2, 1); assert tuple(map(int, m.version('setuptools').split('.'))) >= (78, 1, 1)"
      - name: Enforce backend vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: moneybee-${{ matrix.role }}:ci
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: moneybee-${{ matrix.role }}:ci
          format: cyclonedx-json
          output-file: moneybee-${{ matrix.role }}.sbom.cdx.json
          upload-artifact: false
      - name: Upload release SBOM
        uses: actions/upload-artifact@v4
        with:
          name: moneybee-${{ matrix.role }}-sbom
          path: moneybee-${{ matrix.role }}.sbom.cdx.json
