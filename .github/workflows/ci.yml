name: backend-ci

on:
  pull_request:
  push:
    branches: ["main", "planning/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
      - name: Verify migration upgrade and rollback
        env:
          APP_ENV: test
          AUTO_CREATE_SCHEMA: "false"
          LOCAL_AUTH_BYPASS: "true"
          DATABASE_URL: sqlite+aiosqlite:///./migration-test.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python -m compileall -q app migrations
      - run: docker build -t moneybee-backend:test .
