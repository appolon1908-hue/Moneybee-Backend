name: backend-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: moneybee
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://moneybee:moneybee@localhost:5432/moneybee
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests scripts
      - run: mypy app scripts
      - run: alembic upgrade head
      - run: pytest -q
      - name: Generate OpenAPI candidate
        run: python scripts/generate_openapi.py --output openapi.generated.json
      - name: Preserve OpenAPI candidate
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: openapi.generated.json
          if-no-files-found: error
      - name: Check committed OpenAPI contract
        if: ${{ hashFiles('openapi.json') != '' }}
        run: python scripts/generate_openapi.py --check --output openapi.json
      - run: docker build -t moneybee-api:${{ github.sha }} .
