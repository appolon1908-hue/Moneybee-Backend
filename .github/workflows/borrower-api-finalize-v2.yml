name: Borrower API finalization v2

on:
  push:
    branches:
      - feature/borrower-portal-api

permissions:
  contents: write

concurrency:
  group: borrower-api-finalization-v2
  cancel-in-progress: false

jobs:
  synchronize-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
          POSTGRES_DB: moneybee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://moneybee:moneybee@localhost:5432/moneybee_test
      ENVIRONMENT: test
      MONEYBEE_ALLOW_TEST_AUTH: "true"
      LIVE_WRITES: "false"
      ODOO_WRITE: "false"
      ENABLE_EXTERNAL_DELIVERY: "false"
      N8N_DELIVERY_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/borrower-portal-api
          fetch-depth: 0

      - name: Wait for and merge validated foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          ready=0
          for attempt in $(seq 1 80); do
            git fetch origin feature/portal-foundation
            if git show origin/feature/portal-foundation:docs/evidence/portal-foundation-validation.json > /tmp/foundation.json 2>/dev/null; then
              if [ "$(jq -r '.status // ""' /tmp/foundation.json)" = "PASS" ]; then
                ready=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "Validated portal foundation was not available" >&2
            exit 1
          fi
          git merge --no-edit origin/feature/portal-foundation

      - name: Install and normalize
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          if python -m ruff --version >/dev/null 2>&1; then
            python -m ruff check --fix app/borrower_portal.py tests/test_borrower_portal_contract.py
            python -m ruff format app/borrower_portal.py tests/test_borrower_portal_contract.py
          fi

      - name: Validate borrower API
        id: validate
        shell: bash
        run: |
          set +e
          status=0
          python -m compileall -q app migrations tests || status=$?
          pytest -q tests/test_portal_foundation.py tests/test_borrower_portal_contract.py || status=$?
          alembic upgrade 20260826_0013 || status=$?
          python scripts/export_openapi.py || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record and publish branch result
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          mkdir -p docs/evidence
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          code = int(os.environ.get("VALIDATION_STATUS", "1"))
          Path("docs/evidence/borrower-portal-api-validation.json").write_text(
              json.dumps(
                  {
                      "work_package": "feature/borrower-portal-api",
                      "status": "PASS" if code == 0 else "FAIL",
                      "validation_exit_code": code,
                      "base_validation": "portal-foundation=PASS",
                      "syntax": "EXECUTED",
                      "focused_tests": "EXECUTED",
                      "postgres_migration_upgrade": "EXECUTED",
                      "openapi_export": "EXECUTED",
                      "live_capabilities_enabled": [],
                      "production_deployed": False,
                      "recorded_at": datetime.now(UTC).isoformat(),
                  },
                  indent=2,
              )
              + "\n"
          )
          PY
          rm -f .github/workflows/borrower-api-finalize-v2.yml
          git add \
            app/borrower_portal.py tests/test_borrower_portal_contract.py \
            openapi.json docs/evidence/borrower-portal-api-validation.json \
            .github/workflows/borrower-api-finalize-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(borrower): synchronize and validate portal API"
          fi
          git push origin HEAD:feature/borrower-portal-api

      - name: Fail if validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1
