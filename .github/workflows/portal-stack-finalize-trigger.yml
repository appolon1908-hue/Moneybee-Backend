name: Portal backend stack finalization

on:
  push:
    branches:
      - feature/provider-webhook-gateway

permissions:
  contents: write

concurrency:
  group: portal-backend-stack-finalization
  cancel-in-progress: false

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
          POSTGRES_DB: moneybee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://moneybee:moneybee@localhost:5432/moneybee_test
      ENVIRONMENT: test
      MONEYBEE_ALLOW_TEST_AUTH: "true"
      LIVE_WRITES: "false"
      ODOO_WRITE: "false"
      ENABLE_EXTERNAL_DELIVERY: "false"
      N8N_DELIVERY_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-webhook-gateway
          fetch-depth: 0

      - name: Apply final correctness patches
        run: |
          python - <<'PY'
          from pathlib import Path

          # Ensure the portal runtime and models are registered with FastAPI.
          main = Path("app/main.py")
          text = main.read_text()
          if "from app import portal_models" not in text and "portal_models" not in text.splitlines()[0:30]:
              marker_candidates = (
                  "from app import identity_models, models",
                  "from app import models, identity_models",
              )
              for marker in marker_candidates:
                  if marker in text:
                      text = text.replace(marker, marker + ", portal_models", 1)
                      break
              else:
                  text = "from app import portal_models\n" + text
          portal_import = "from app.portal_router import router as portal_router"
          if portal_import not in text:
              marker = "from app.integration_routes import router as integration_router"
              if marker not in text:
                  raise SystemExit("Could not locate integration router import marker")
              text = text.replace(marker, marker + "\n" + portal_import, 1)
          registration = 'app.include_router(portal_router, prefix="/api/v2")'
          if registration not in text:
              candidates = (
                  'app.include_router(integration_router, prefix="/api/v2")',
                  "app.include_router(integration_router, prefix='/api/v2')",
              )
              for marker in candidates:
                  if marker in text:
                      text = text.replace(marker, marker + "\n" + registration, 1)
                      break
              else:
                  raise SystemExit("Could not locate /api/v2 router registration")
          main.write_text(text)

          # Portal mixins must precede the declarative base in the MRO.
          models = Path("app/portal_models.py")
          text = models.read_text()
          for name in (
              "PortalTask",
              "PortalNotification",
              "PortalConversation",
              "PortalMessage",
              "PortalUploadSession",
              "ProviderWebhookReceipt",
          ):
              text = text.replace(
                  f"class {name}(Base, PortalRecord):",
                  f"class {name}(PortalRecord, Base):",
              )
          models.write_text(text)

          # Upload clients need the authoritative optimistic version.
          schemas = Path("app/portal_schemas.py")
          text = schemas.read_text()
          marker = "class UploadSessionRead(PortalModel):\n    id: uuid.UUID\n"
          if marker in text and "class UploadSessionRead(PortalModel):\n    id: uuid.UUID\n    version: int\n" not in text:
              text = text.replace(
                  marker,
                  "class UploadSessionRead(PortalModel):\n    id: uuid.UUID\n    version: int\n",
                  1,
              )
          schemas.write_text(text)

          # FastAPI dependencies should remain required, never nullable defaults.
          admin = Path("app/admin_portal.py")
          text = admin.read_text()
          text = text.replace(
              "from datetime import date, datetime",
              "from datetime import UTC, date, datetime",
              1,
          )
          old_signature = '''def global_operations_search(
    q: str = Query(min_length=2, max_length=120),
    principal: Annotated[Principal, Depends(get_current_user)] = None,
    db: Annotated[Session, Depends(get_db)] = None,
    limit_per_type: int = Query(default=10, ge=1, le=25),
):'''
          new_signature = '''def global_operations_search(
    principal: Annotated[Principal, Depends(get_current_user)],
    db: Annotated[Session, Depends(get_db)],
    q: str = Query(min_length=2, max_length=120),
    limit_per_type: int = Query(default=10, ge=1, le=25),
):'''
          text = text.replace(old_signature, new_signature, 1)
          text = text.replace("datetime.now().astimezone()", "datetime.now(UTC)")
          admin.write_text(text)

          # Reject malformed Content-Length without leaking an unhandled ValueError.
          gateway = Path("app/webhook_gateway.py")
          text = gateway.read_text()
          old = '''    content_length = request.headers.get("content-length")
    if content_length and int(content_length) > MAX_WEBHOOK_BYTES:
        raise HTTPException(
            status_code=413,
            detail={"code": "WEBHOOK_TOO_LARGE", "message": "Webhook is too large."},
        )
'''
          new = '''    content_length = request.headers.get("content-length")
    if content_length:
        try:
            declared_length = int(content_length)
        except ValueError as exc:
            raise HTTPException(
                status_code=400,
                detail={
                    "code": "INVALID_CONTENT_LENGTH",
                    "message": "Content-Length must be an integer.",
                },
            ) from exc
        if declared_length < 0:
            raise HTTPException(
                status_code=400,
                detail={
                    "code": "INVALID_CONTENT_LENGTH",
                    "message": "Content-Length cannot be negative.",
                },
            )
        if declared_length > MAX_WEBHOOK_BYTES:
            raise HTTPException(
                status_code=413,
                detail={
                    "code": "WEBHOOK_TOO_LARGE",
                    "message": "Webhook is too large.",
                },
            )
'''
          if old in text:
              text = text.replace(old, new, 1)
          gateway.write_text(text)

          # Add the S3-compatible SDK used by the secure upload adapter.
          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          if "boto3" not in text:
              marker = "dependencies = ["
              if marker not in text:
                  raise SystemExit("Could not locate pyproject dependencies")
              text = text.replace(
                  marker,
                  marker + '\n  "boto3>=1.35,<2",',
                  1,
              )
          pyproject.write_text(text)
          PY

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Format and lint new feature code
        run: |
          if python -m ruff --version >/dev/null 2>&1; then
            python -m ruff check --fix \
              app/portal_permissions.py \
              app/portal_models.py \
              app/portal_schemas.py \
              app/portal_storage.py \
              app/portal_core.py \
              app/portal_router.py \
              app/borrower_portal.py \
              app/lender_portal.py \
              app/lender_portal_models.py \
              app/admin_portal.py \
              app/webhook_gateway.py \
              tests/test_portal_foundation.py \
              tests/test_borrower_portal_contract.py \
              tests/test_lender_portal_contract.py \
              tests/test_admin_portal_contract.py \
              tests/test_webhook_gateway_contract.py
            python -m ruff format \
              app/portal_permissions.py \
              app/portal_models.py \
              app/portal_schemas.py \
              app/portal_storage.py \
              app/portal_core.py \
              app/portal_router.py \
              app/borrower_portal.py \
              app/lender_portal.py \
              app/lender_portal_models.py \
              app/admin_portal.py \
              app/webhook_gateway.py \
              tests/test_portal_foundation.py \
              tests/test_borrower_portal_contract.py \
              tests/test_lender_portal_contract.py \
              tests/test_admin_portal_contract.py \
              tests/test_webhook_gateway_contract.py
          fi

      - name: Validate syntax and focused contracts
        id: validate
        shell: bash
        run: |
          set +e
          status=0
          python -m compileall -q app migrations tests || status=$?
          pytest -q \
            tests/test_portal_foundation.py \
            tests/test_borrower_portal_contract.py \
            tests/test_lender_portal_contract.py \
            tests/test_admin_portal_contract.py \
            tests/test_webhook_gateway_contract.py || status=$?
          alembic upgrade head || status=$?
          alembic downgrade 20260823_0012 || status=$?
          alembic upgrade head || status=$?
          python scripts/export_openapi.py || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit validated backend stack
        run: |
          rm -f .github/workflows/portal-bootstrap-once.yml
          rm -f .github/workflows/portal-bootstrap-trigger.yml
          rm -f .github/workflows/portal-stack-finalize-trigger.yml
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/main.py \
            app/portal_permissions.py \
            app/portal_models.py \
            app/portal_schemas.py \
            app/portal_storage.py \
            app/portal_core.py \
            app/portal_router.py \
            app/borrower_portal.py \
            app/lender_portal.py \
            app/lender_portal_models.py \
            app/admin_portal.py \
            app/webhook_gateway.py \
            tests/test_portal_foundation.py \
            tests/test_borrower_portal_contract.py \
            tests/test_lender_portal_contract.py \
            tests/test_admin_portal_contract.py \
            tests/test_webhook_gateway_contract.py \
            pyproject.toml \
            openapi.json \
            .github/workflows/portal-bootstrap-once.yml \
            .github/workflows/portal-bootstrap-trigger.yml \
            .github/workflows/portal-stack-finalize-trigger.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(portal): finalize validated backend stack"
            git push origin HEAD:feature/provider-webhook-gateway
          fi

      - name: Fail when validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1
