name: endpoint-catalog-sync

on:
  push:
    branches:
      - "claude/system-review-architecture-8vo66p"
    paths-ignore:
      - "docs/API_ENDPOINT_CATALOG.md"

permissions:
  contents: write

concurrency:
  group: endpoint-catalog-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./endpoint-catalog.db
      AUTO_CREATE_SCHEMA: "true"
      LOCAL_AUTH_BYPASS: "true"
      ENABLE_EXTERNAL_DELIVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install reviewed dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Generate the endpoint catalog
        run: python scripts/generate_endpoint_catalog.py
      - name: Commit only generated catalog drift
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/API_ENDPOINT_CATALOG.md; then
            echo "Endpoint catalog is already synchronized."
            exit 0
          fi
          if test -n "$(git status --porcelain --untracked-files=no | grep -v '^ M docs/API_ENDPOINT_CATALOG.md$' || true)"; then
            echo "Refusing to commit changes outside docs/API_ENDPOINT_CATALOG.md" >&2
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/API_ENDPOINT_CATALOG.md
          git commit -m "docs(api): synchronize generated endpoint catalog"
          git push origin "HEAD:${BRANCH_NAME}"
