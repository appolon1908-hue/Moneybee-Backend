name: Admin operations API finalization v2

on:
  push:
    branches:
      - feature/admin-operations-api

permissions:
  contents: write

concurrency:
  group: admin-api-finalization-v2
  cancel-in-progress: false

jobs:
  synchronize-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneybee
          POSTGRES_PASSWORD: moneybee
          POSTGRES_DB: moneybee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneybee -d moneybee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://moneybee:moneybee@localhost:5432/moneybee_test
      ENVIRONMENT: test
      MONEYBEE_ALLOW_TEST_AUTH: "true"
      LIVE_WRITES: "false"
      ODOO_WRITE: "false"
      ENABLE_EXTERNAL_DELIVERY: "false"
      N8N_DELIVERY_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-operations-api
          fetch-depth: 0

      - name: Wait for and merge validated lender API
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "moneybee-automation"
          git config user.email "actions@users.noreply.github.com"
          ready=0
          for attempt in $(seq 1 80); do
            git fetch origin feature/lender-bank-portal-api
            if git show origin/feature/lender-bank-portal-api:docs/evidence/lender-bank-portal-api-validation.json > /tmp/lender.json 2>/dev/null; then
              if [ "$(jq -r '.status // ""' /tmp/lender.json)" = "PASS" ]; then
                ready=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "Validated lender API was not available" >&2
            exit 1
          fi
          git merge --no-edit origin/feature/lender-bank-portal-api

      - name: Correct operations API dependency signatures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/admin_portal.py")
          text = path.read_text()
          text = text.replace(
              "from datetime import date, datetime",
              "from datetime import UTC, date, datetime",
              1,
          )
          old_signature = '''def global_operations_search(
    q: str = Query(min_length=2, max_length=120),
    principal: Annotated[Principal, Depends(get_current_user)] = None,
    db: Annotated[Session, Depends(get_db)] = None,
    limit_per_type: int = Query(default=10, ge=1, le=25),
):'''
          new_signature = '''def global_operations_search(
    principal: Annotated[Principal, Depends(get_current_user)],
    db: Annotated[Session, Depends(get_db)],
    q: str = Query(min_length=2, max_length=120),
    limit_per_type: int = Query(default=10, ge=1, le=25),
):'''
          text = text.replace(old_signature, new_signature, 1)
          text = text.replace("datetime.now().astimezone()", "datetime.now(UTC)")
          path.write_text(text)
          PY

      - name: Install and normalize
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          if python -m ruff --version >/dev/null 2>&1; then
            python -m ruff check --fix app/admin_portal.py tests/test_admin_portal_contract.py
            python -m ruff format app/admin_portal.py tests/test_admin_portal_contract.py
          fi

      - name: Validate operations API
        id: validate
        shell: bash
        run: |
          set +e
          status=0
          python -m compileall -q app migrations tests || status=$?
          pytest -q \
            tests/test_portal_foundation.py \
            tests/test_borrower_portal_contract.py \
            tests/test_lender_portal_contract.py \
            tests/test_admin_portal_contract.py || status=$?
          alembic upgrade 20260826_0014 || status=$?
          python scripts/export_openapi.py || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record and publish branch result
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          mkdir -p docs/evidence
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          code = int(os.environ.get("VALIDATION_STATUS", "1"))
          Path("docs/evidence/admin-operations-api-validation.json").write_text(
              json.dumps(
                  {
                      "work_package": "feature/admin-operations-api",
                      "status": "PASS" if code == 0 else "FAIL",
                      "validation_exit_code": code,
                      "base_validation": "lender-bank-portal-api=PASS",
                      "syntax": "EXECUTED",
                      "focused_tests": "EXECUTED",
                      "postgres_migration_upgrade": "EXECUTED",
                      "openapi_export": "EXECUTED",
                      "live_capabilities_enabled": [],
                      "production_deployed": False,
                      "recorded_at": datetime.now(UTC).isoformat(),
                  },
                  indent=2,
              )
              + "\n"
          )
          PY
          rm -f .github/workflows/admin-api-finalize-v2.yml
          git add \
            app/admin_portal.py tests/test_admin_portal_contract.py openapi.json \
            docs/evidence/admin-operations-api-validation.json \
            .github/workflows/admin-api-finalize-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(admin): synchronize and validate operations API"
          fi
          git push origin HEAD:feature/admin-operations-api

      - name: Fail if validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1
