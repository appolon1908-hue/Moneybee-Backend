groups:
  - name: moneybee.api
    rules:
      - alert: MoneyBeeApiDown
        expr: up{job="moneybee-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: moneybee
        annotations:
          summary: MoneyBee API metrics target is down
          description: Prometheus cannot scrape moneybee-api:8000/metrics.

      - alert: MoneyBeeApiElevated5xx
        expr: sum(rate(moneybee_http_requests_total{status_class="5xx"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          service: moneybee
        annotations:
          summary: MoneyBee API 5xx rate is elevated
          description: More than 0.05 5xx responses per second for 5 minutes.

      - alert: MoneyBeeApiHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(moneybee_http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels:
          severity: warning
          service: moneybee
        annotations:
          summary: MoneyBee API p95 latency is high
          description: API p95 latency is above 1.5 seconds for 10 minutes.

      - alert: MoneyBeePublicRateLimitSpike
        expr: sum(rate(moneybee_http_requests_total{status_class="4xx",rate_scope="public"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: moneybee
        annotations:
          summary: MoneyBee public intake rate limiting increased
          description: Public intake traffic is hitting rate limits or client-side 4xx responses.

  - name: moneybee.edge
    rules:
      - alert: MoneyBeePublicEndpointDown
        expr: probe_success{job="moneybee-health"} == 0
        for: 2m
        labels:
          severity: critical
          service: moneybee
        annotations:
          summary: MoneyBee public endpoint probe failed
          description: "{{ $labels.instance }} is not returning a successful HTTPS response."

      - alert: MoneyBeeSecurityHeadersMissing
        expr: probe_success{job="moneybee-edge-security-headers"} == 0
        for: 2m
        labels:
          severity: critical
          service: moneybee
        annotations:
          summary: MoneyBee edge security header probe failed
          description: "{{ $labels.instance }} is missing required TLS/CSP/security headers or is not reachable."

      - alert: MoneyBeeTlsCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job=~"moneybee-health|moneybee-edge-security-headers"} - time() < 1209600
        for: 1h
        labels:
          severity: warning
          service: moneybee
        annotations:
          summary: MoneyBee TLS certificate expires within 14 days
          description: "{{ $labels.instance }} has a TLS certificate approaching expiry."

  - name: moneybee.infrastructure
    rules:
      - alert: MoneyBeePostgresExporterDown
        expr: up{job="postgres-exporter"} == 0
        for: 5m
        labels:
          severity: warning
          service: moneybee
        annotations:
          summary: MoneyBee PostgreSQL exporter is down
          description: PostgreSQL metrics are unavailable.

      - alert: MoneyBeeRedisExporterDown
        expr: up{job="redis-exporter"} == 0
        for: 5m
        labels:
          severity: warning
          service: moneybee
        annotations:
          summary: MoneyBee Redis exporter is down
          description: Redis metrics are unavailable.
