global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    platform: codestra
    service: moneybee

rule_files:
  - /etc/prometheus/rules/moneybee-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: moneybee-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - moneybee-api:8000
        labels:
          app: moneybee
          component: api

  - job_name: moneybee-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://moneybeeloan.com
          - https://app.moneybeeloan.com
          - https://lenders.moneybeeloan.com
          - https://admin.moneybeeloan.com
          - https://api.moneybeeloan.com/health/live
          - https://api.moneybeeloan.com/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: moneybee-edge-security-headers
    metrics_path: /probe
    params:
      module: [http_moneybee_security_headers]
    static_configs:
      - targets:
          - https://moneybeeloan.com
          - https://app.moneybeeloan.com
          - https://lenders.moneybeeloan.com
          - https://admin.moneybeeloan.com
          - https://api.moneybeeloan.com/health/live
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          app: moneybee
          component: host

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          app: moneybee
          component: containers

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          app: moneybee
          component: postgres

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          app: moneybee
          component: redis
