modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
        - 204
        - 301
        - 302
        - 307
        - 308
      fail_if_not_ssl: true

  http_moneybee_security_headers:
    prober: http
    timeout: 8s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      valid_status_codes:
        - 200
        - 204
      fail_if_not_ssl: true
      fail_if_header_not_matches:
        - header: Strict-Transport-Security
          regexp: "max-age=31536000"
        - header: Content-Security-Policy
          regexp: "default-src"
        - header: X-Content-Type-Options
          regexp: "nosniff"
        - header: Referrer-Policy
          regexp: "strict-origin-when-cross-origin"
