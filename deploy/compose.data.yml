name: moneybee-data

services:
  postgres:
    image: ${MONEYBEE_POSTGRES_IMAGE:?set an immutable PostgreSQL image digest}
    environment:
      POSTGRES_DB: moneybee
      # Fresh clusters only. Changing POSTGRES_USER does not alter an existing data directory.
      POSTGRES_USER: moneybee_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - type: bind
        source: ${MONEYBEE_POSTGRES_DATA_PATH:?runtime path is not verified}
        target: /var/lib/postgresql/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /var/run/postgresql:rw,nosuid,size=16m
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 300
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneybee_admin -d moneybee"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      moneybee_internal:
        aliases:
          - moneybee-postgres

  role-bootstrap:
    image: ${MONEYBEE_POSTGRES_IMAGE:?set an immutable PostgreSQL image digest}
    profiles: ["bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export PGPASSWORD="$$(cat /run/secrets/postgres_admin_password)";
        exec psql -h moneybee-postgres -U moneybee_admin -d moneybee
        -v ON_ERROR_STOP=1
        -v migrator_password="$$(cat /run/secrets/postgres_migrator_password)"
        -v runtime_password="$$(cat /run/secrets/postgres_runtime_password)"
        -f /bootstrap/moneybee_roles.sql
    secrets:
      - postgres_admin_password
      - postgres_migrator_password
      - postgres_runtime_password
    volumes:
      - type: bind
        source: ${MONEYBEE_ROLES_SQL_PATH:?role bootstrap SQL path is not verified}
        target: /bootstrap/moneybee_roles.sql
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - moneybee_internal

  redis:
    image: ${MONEYBEE_REDIS_IMAGE:?set an immutable Redis image digest}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aclfile
      - /run/secrets/redis_acl
    secrets:
      - redis_acl
    volumes:
      - type: bind
        source: ${MONEYBEE_REDIS_DATA_PATH:?runtime path is not verified}
        target: /data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          password="$$(sed -n 's/^user health .*>\([^ ]*\).*/\1/p' /run/secrets/redis_acl)";
          test -n "$$password" &&
          redis-cli --user health --pass "$$password" --no-auth-warning ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      moneybee_internal:
        aliases:
          - moneybee-redis

secrets:
  postgres_admin_password:
    file: ${MONEYBEE_POSTGRES_ADMIN_PASSWORD_FILE:?admin password path is not verified}
  postgres_migrator_password:
    file: ${MONEYBEE_POSTGRES_MIGRATOR_PASSWORD_FILE:?migrator password path is not verified}
  postgres_runtime_password:
    file: ${MONEYBEE_POSTGRES_RUNTIME_PASSWORD_FILE:?runtime password path is not verified}
  redis_acl:
    file: ${MONEYBEE_REDIS_ACL_FILE:?runtime path is not verified}

networks:
  moneybee_internal:
    external: true
    name: ${MONEYBEE_INTERNAL_NETWORK:-moneybee_internal}
