name: moneybee

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneybee
      POSTGRES_USER: moneybee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneybee -d moneybee"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://moneybee:${POSTGRES_PASSWORD}@postgres:5432/moneybee
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://moneybee:${POSTGRES_PASSWORD}@postgres:5432/moneybee
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  marketing:
    build:
      context: ../../Moneybee-frontend-
      args:
        APP: marketing
        VITE_API_BASE_URL: https://api.moneybeeloan.com/api/v2
        VITE_BORROWER_URL: https://app.moneybeeloan.com
        VITE_LENDER_URL: https://lenders.moneybeeloan.com
        VITE_ADMIN_URL: https://admin.moneybeeloan.com
        VITE_OIDC_AUTHORITY: https://auth.codestra.co/realms/codestra
        VITE_OIDC_CLIENT_ID: moneybee-web
        VITE_OIDC_AUDIENCE: moneybee-api
    restart: unless-stopped
    networks:
      - web

  borrower:
    build:
      context: ../../Moneybee-frontend-
      args:
        APP: borrower
        VITE_API_BASE_URL: https://api.moneybeeloan.com/api/v2
        VITE_OIDC_AUTHORITY: https://auth.codestra.co/realms/codestra
        VITE_OIDC_CLIENT_ID: moneybee-web
        VITE_OIDC_AUDIENCE: moneybee-api
    restart: unless-stopped
    networks:
      - web

  lender:
    build:
      context: ../../Moneybee-frontend-
      args:
        APP: lender
        VITE_API_BASE_URL: https://api.moneybeeloan.com/api/v2
        VITE_OIDC_AUTHORITY: https://auth.codestra.co/realms/codestra
        VITE_OIDC_CLIENT_ID: moneybee-web
        VITE_OIDC_AUDIENCE: moneybee-api
    restart: unless-stopped
    networks:
      - web

  admin:
    build:
      context: ../../Moneybee-frontend-
      args:
        APP: admin
        VITE_API_BASE_URL: https://api.moneybeeloan.com/api/v2
        VITE_OIDC_AUTHORITY: https://auth.codestra.co/realms/codestra
        VITE_OIDC_CLIENT_ID: moneybee-web
        VITE_OIDC_AUDIENCE: moneybee-api
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      marketing:
        condition: service_started
      borrower:
        condition: service_started
      lender:
        condition: service_started
      admin:
        condition: service_started
    networks:
      - web

networks:
  internal:
    internal: true
  web:

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
