name: moneybee-backend

services:
  migrate:
    image: ${MONEYBEE_MIGRATE_IMAGE:?set an immutable migrate image digest}
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ${MONEYBEE_MIGRATION_ENV_FILE:?migration environment path is not verified}
    profiles: ["migrate"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - moneybee_internal
    restart: "no"

  api:
    image: ${MONEYBEE_API_IMAGE:?set an immutable API image digest}
    env_file:
      - ${MONEYBEE_BACKEND_ENV_FILE:?backend runtime environment path is not verified}
    environment:
      TRUST_FORWARDED_FOR: "true"
      TRUSTED_PROXY_CIDRS_CSV: ${MONEYBEE_TRUSTED_PROXY_CIDRS_CSV:?trusted Caddy proxy CIDRs are not verified}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 300
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s
    networks:
      moneybee_internal: {}
      moneybee_edge:
        aliases:
          - moneybee-api

  worker:
    image: ${MONEYBEE_WORKER_IMAGE:?set an immutable worker image digest}
    env_file:
      - ${MONEYBEE_BACKEND_ENV_FILE:?backend runtime environment path is not verified}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - moneybee_internal

  clamav:
    image: ${MONEYBEE_CLAMAV_IMAGE:?set an immutable ClamAV image digest}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run/clamav:rw,nosuid,size=32m
    volumes:
      - type: bind
        source: ${MONEYBEE_CLAMAV_DATABASE_PATH:?ClamAV database path is not verified}
        target: /var/lib/clamav
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 300
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      moneybee_internal:
        aliases:
          - moneybee-clamav

networks:
  moneybee_internal:
    external: true
    name: ${MONEYBEE_INTERNAL_NETWORK:-moneybee_internal}
  moneybee_edge:
    external: true
    name: ${MONEYBEE_EDGE_NETWORK:-moneybee_edge}
